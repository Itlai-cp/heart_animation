<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>晚上星月争辉，美梦陪你入睡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            
            // ==========================================
            // 调整这个数字可以微调跳动周期，但现在的效果应该非常舒缓了
            // ==========================================
            const HEARTBEAT_SPEED = 0.6;
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const HEART_COLOR = '#FF1744';
            let frame = 0;

            function heartFunction(t, scale = 12) {
                const x = 17 * Math.pow(Math.sin(t), 3);
                const y = -(16 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return {
                    x: x * scale + canvas.width / 2,
                    y: y * scale + canvas.height / 2
                };
            }

            // 关键修改在这里：使用更舒缓的正弦波来模拟心跳
            function heartbeatRhythm(p) {
                // 使用 abs(sin) 来创造连续的“膨胀”和“收缩”感，频率由 HEARTBEAT_SPEED 控制
                return Math.abs(Math.sin(HEARTBEAT_SPEED * p));
            }

            class Heart {
                constructor() {
                    this.points = [];
                    this.edgePoints = [];
                    this.centerPoints = [];
                    this.cx = canvas.width / 2;
                    this.cy = canvas.height / 2;
                    this.build();
                    window.addEventListener('resize', () => {
                        this.cx = canvas.width / 2;
                        this.cy = canvas.height / 2;
                    });
                }

                scatter(x, y, beta) {
                    const ratioX = -beta * Math.log(Math.random());
                    const ratioY = -beta * Math.log(Math.random());
                    return {
                        x: x - ratioX * (x - this.cx),
                        y: y - ratioY * (y - this.cy)
                    };
                }

                build() {
                    this.points = [];
                    this.edgePoints = [];
                    this.centerPoints = [];
                    // 生成主轮廓
                    for (let i = 0; i < 2000; i++) {
                        const t = Math.random() * 2 * Math.PI;
                        const pos = heartFunction(t);
                        this.points.push(pos);
                    }
                    // 边缘扩散
                    for (let pt of this.points) {
                        for (let i = 0; i < 3; i++) {
                            this.edgePoints.push(this.scatter(pt.x, pt.y, 0.05));
                        }
                    }
                    // 中心扩散
                    for (let i = 0; i < 10000; i++) {
                        const pt = this.points[Math.floor(Math.random() * this.points.length)];
                        this.centerPoints.push(this.scatter(pt.x, pt.y, 0.27));
                    }
                }

                calcPosition(x, y, ratio) {
                    const dist = Math.sqrt(Math.pow(x - this.cx, 2) + Math.pow(y - this.cy, 2));
                    const force = 1 / Math.pow(dist, 0.42);
                    const dx = ratio * force * (x - this.cx) + (Math.random() - 0.5) * 2;
                    const dy = ratio * force * (y - this.cy) + (Math.random() - 0.5) * 2;
                    return { x: x - dx, y: y - dy };
                }

                render(ctx, currentFrame) {
                    // 使用新的心跳节奏，缩放范围控制在 12 到 15 之间，避免跳动幅度过大
                    const beat = heartbeatRhythm(currentFrame / 10 * Math.PI);
                    const ratio = 12 + 3 * beat;
                    
                    // 光环的半径和数量也随心跳变化，但做了平滑处理
                    const haloRadius = 4 + 6 * beat;
                    const haloNumber = Math.floor(3000 + 4000 * Math.pow(beat, 2));

                    // 光环
                    ctx.fillStyle = HEART_COLOR;
                    ctx.globalAlpha = 0.15 + 0.15 * beat; // 光环透明度也随心跳变化
                    for (let i = 0; i < haloNumber; i++) {
                        const t = Math.random() * 2 * Math.PI;
                        const pos = heartFunction(t, -15);
                        const dist = Math.sqrt(Math.pow(pos.x - this.cx, 2) + Math.pow(pos.y - this.cy, 2));
                        const force = -1 / Math.pow(dist, 0.6);
                        const dx = haloRadius * force * (pos.x - this.cx);
                        const dy = haloRadius * force * (pos.y - this.cy);
                        const x = pos.x - dx + (Math.random() - 0.5) * 120;
                        const y = pos.y - dy + (Math.random() - 0.5) * 120;
                        const size = Math.random() < 0.7 ? 1 : 2;
                        ctx.fillRect(x, y, size, size);
                    }

                    // 主轮廓
                    ctx.globalAlpha = 1;
                    for (let pt of this.points) {
                        const pos = this.calcPosition(pt.x, pt.y, ratio);
                        const size = Math.floor(Math.random() * 3) + 1;
                        ctx.fillRect(pos.x, pos.y, size, size);
                    }

                    // 边缘
                    ctx.globalAlpha = 0.8;
                    for (let pt of this.edgePoints) {
                        const pos = this.calcPosition(pt.x, pt.y, ratio);
                        const size = Math.floor(Math.random() * 2) + 1;
                        ctx.fillRect(pos.x, pos.y, size, size);
                    }

                    // 中心
                    ctx.globalAlpha = 0.9;
                    for (let pt of this.centerPoints) {
                        const pos = this.calcPosition(pt.x, pt.y, ratio);
                        const size = Math.floor(Math.random() * 2) + 1;
                        ctx.fillRect(pos.x, pos.y, size, size);
                    }
                    ctx.globalAlpha = 1;
                }
            }

            const heart = new Heart();

            function animate() {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                heart.render(ctx, frame);
                // 稍慢的帧递增，让整体动画更平滑
                frame += 0.4;
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                heart.build();
            });

            animate();
        })();
    </script>
</body>
</html>
