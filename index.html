<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>晚上星月争辉，美梦陪你入睡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 100);
        camera.position.set(0, 0, 42);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ==================== 粒子贴图 ====================
        function createGlowTexture(innerColor, outerColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, innerColor);
            gradient.addColorStop(0.3, innerColor);
            gradient.addColorStop(0.7, outerColor);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const redGlowTexture = createGlowTexture('rgba(255,255,255,1)', 'rgba(255,30,60,0)');
        const blueGlowTexture = createGlowTexture('rgba(180,220,255,1)', 'rgba(30,100,255,0)');

        // ==================== 心形函数 ====================
        function heartPosition(t, scale = 1) {
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
            return { x, y };
        }

        // 判断点是否在心形内部
        function isInsideHeart(x, y) {
            // 使用心形隐式方程近似判断
            const xx = x / 16;
            const yy = y / 16;
            const value = Math.pow(xx, 2) + Math.pow(yy - Math.pow(Math.pow(xx, 2), 1/3), 2);
            return value < 1.2;
        }

        // ==================== 生成3D粒子爱心 ====================
        function createParticleHeart() {
            const totalLayers = 18;
            const pointsPerLayer = 2000;
            const totalPoints = totalLayers * pointsPerLayer;
            
            const surfacePositions = []; // 表面红色粒子
            const surfaceBasePositions = [];
            const surfaceColors = [];
            
            const innerPositions = []; // 内部蓝色粒子
            const innerBasePositions = [];
            const innerColors = [];
            
            for (let layer = 0; layer < totalLayers; layer++) {
                const zNorm = (layer / (totalLayers - 1) - 0.5) * 2;
                const zThickness = 4.0;
                const z = zNorm * zThickness;
                const depthScale = 1 - Math.abs(zNorm) * 0.25;
                
                for (let i = 0; i < pointsPerLayer; i++) {
                    const t = Math.random() * Math.PI * 2;
                    const heartPos = heartPosition(t, depthScale);
                    
                    // 随机决定这个粒子在表面还是内部
                    const rand = Math.random();
                    
                    if (rand < 0.35) {
                        // 表面红色粒子
                        const spread = 0.06;
                        const x = heartPos.x + (Math.random() - 0.5) * spread * 3;
                        const y = heartPos.y + (Math.random() - 0.5) * spread * 3;
                        const zFinal = z + (Math.random() - 0.5) * spread;
                        
                        surfacePositions.push(x, y, zFinal);
                        surfaceBasePositions.push(x, y, zFinal);
                        surfaceColors.push(1, 0.08 + Math.random() * 0.25, 0.1 + Math.random() * 0.3);
                    } else {
                        // 内部蓝色粒子 - 填充爱心内部
                        const innerScale = depthScale * (0.15 + Math.random() * 0.85);
                        const innerHeartPos = heartPosition(t, innerScale);
                        
                        const innerSpread = 0.2;
                        const x = innerHeartPos.x + (Math.random() - 0.5) * innerSpread * 3;
                        const y = innerHeartPos.y + (Math.random() - 0.5) * innerSpread * 3;
                        const zFinal = z * (0.3 + Math.random() * 0.7) + (Math.random() - 0.5) * innerSpread;
                        
                        // 检查是否在爱心内部
                        if (isInsideHeart(x / depthScale, y / depthScale) || Math.random() < 0.7) {
                            innerPositions.push(x, y, zFinal);
                            innerBasePositions.push(x, y, zFinal);
                            // 蓝色调
                            const blueVar = Math.random();
                            innerColors.push(
                                0.15 + blueVar * 0.3,
                                0.4 + blueVar * 0.4,
                                0.7 + blueVar * 0.3
                            );
                        }
                    }
                }
            }
            
            return {
                surfacePositions: new Float32Array(surfacePositions),
                surfaceBasePositions: new Float32Array(surfaceBasePositions),
                surfaceColors: new Float32Array(surfaceColors),
                innerPositions: new Float32Array(innerPositions),
                innerBasePositions: new Float32Array(innerBasePositions),
                innerColors: new Float32Array(innerColors),
            };
        }

        const heartData = createParticleHeart();
        const heartGroup = new THREE.Group();

        // ==================== 表面红色粒子 ====================
        const surfaceGeometry = new THREE.BufferGeometry();
        surfaceGeometry.setAttribute('position', new THREE.BufferAttribute(heartData.surfacePositions, 3));
        surfaceGeometry.setAttribute('color', new THREE.BufferAttribute(heartData.surfaceColors, 3));
        
        const surfaceMaterial = new THREE.PointsMaterial({
            size: 0.35,
            map: redGlowTexture,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.85,
        });
        
        const surfacePoints = new THREE.Points(surfaceGeometry, surfaceMaterial);
        heartGroup.add(surfacePoints);

        // ==================== 内部蓝色粒子 ====================
        const innerGeometry = new THREE.BufferGeometry();
        innerGeometry.setAttribute('position', new THREE.BufferAttribute(heartData.innerPositions, 3));
        innerGeometry.setAttribute('color', new THREE.BufferAttribute(heartData.innerColors, 3));
        
        const innerMaterial = new THREE.PointsMaterial({
            size: 0.28,
            map: blueGlowTexture,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.75,
        });
        
        const innerPoints = new THREE.Points(innerGeometry, innerMaterial);
        heartGroup.add(innerPoints);

        // ==================== 外层光晕 ====================
        function createHalo(count, scaleMultiplier, size, colorHex, baseOpacity) {
            const positions = new Float32Array(count * 3);
            const basePos = new Float32Array(count * 3);
            
            for (let i = 0; i < count; i++) {
                const t = Math.random() * Math.PI * 2;
                const heartPos = heartPosition(t, scaleMultiplier);
                const z = (Math.random() - 0.5) * 5;
                
                const x = heartPos.x + (Math.random() - 0.5) * 2.5;
                const y = heartPos.y + (Math.random() - 0.5) * 2.5;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                basePos[i * 3] = x;
                basePos[i * 3 + 1] = y;
                basePos[i * 3 + 2] = z;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                size: size,
                map: redGlowTexture,
                color: new THREE.Color(colorHex),
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: baseOpacity,
            });
            
            return { points: new THREE.Points(geometry, material), basePositions: basePos, geometry, material };
        }

        const halo1 = createHalo(2500, 1.04, 0.3, '#FF6B81', 0.45);
        const halo2 = createHalo(1800, 1.1, 0.2, '#FF8A9E', 0.3);
        const halo3 = createHalo(1200, 1.18, 0.14, '#FFB3C1', 0.18);
        
        heartGroup.add(halo1.points);
        heartGroup.add(halo2.points);
        heartGroup.add(halo3.points);

        scene.add(heartGroup);

        // ==================== 更新粒子缩放 ====================
        function updateParticleScale(geometry, basePositions, scale) {
            const positions = geometry.attributes.position.array;
            for (let i = 0; i < positions.length / 3; i++) {
                positions[i * 3] = basePositions[i * 3] * scale;
                positions[i * 3 + 1] = basePositions[i * 3 + 1] * scale;
                positions[i * 3 + 2] = basePositions[i * 3 + 2] * scale;
            }
            geometry.attributes.position.needsUpdate = true;
        }

        // ==================== 心脏跳动函数 ====================
        // 模拟真实心跳：快速收缩 → 快速扩张 → 短暂休息
        function heartbeatPattern(time) {
            const period = 1.8; // 每次心跳的周期（秒），越大越慢
            const phase = (time % period) / period; // 0到1
            
            // 模拟心电图式的跳动模式
            if (phase < 0.08) {
                // 快速收缩（8%的周期）
                const t = phase / 0.08;
                const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                return -0.025 * ease;
            } else if (phase < 0.2) {
                // 快速扩张（12%的周期）
                const t = (phase - 0.08) / 0.12;
                const ease = Math.sin(t * Math.PI * 0.5);
                return -0.025 + 0.04 * ease;
            } else if (phase < 0.25) {
                // 轻微回弹
                const t = (phase - 0.2) / 0.05;
                const ease = Math.sin(t * Math.PI);
                return 0.015 - 0.01 * ease;
            } else {
                // 休息期（75%的周期）
                return 0.005 * Math.sin(phase * Math.PI * 2 - 0.5);
            }
        }

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            // ---- 3D旋转 ----
            heartGroup.rotation.y = time * 0.25;
            heartGroup.rotation.x = Math.sin(time * 0.3) * 0.2;
            heartGroup.rotation.z = Math.cos(time * 0.35) * 0.15;
            
            // ---- 心脏跳动 ----
            const heartbeat = heartbeatPattern(time);
            const scale = 1 + heartbeat;
            
            updateParticleScale(surfaceGeometry, heartData.surfaceBasePositions, scale);
            updateParticleScale(innerGeometry, heartData.innerBasePositions, scale);
            updateParticleScale(halo1.geometry, halo1.basePositions, 1 + heartbeat * 1.2);
            updateParticleScale(halo2.geometry, halo2.basePositions, 1 + heartbeat * 1.4);
            updateParticleScale(halo3.geometry, halo3.basePositions, 1 + heartbeat * 1.6);
            
            // ---- 缓慢闪烁 ----
            // 表面红色粒子闪烁（慢速）
            surfaceMaterial.opacity = 0.75 + Math.sin(time * 0.6) * 0.1 + Math.cos(time * 0.8) * 0.08;
            
            // 内部蓝色粒子闪烁（慢速，不同相位）
            innerMaterial.opacity = 0.65 + Math.sin(time * 0.55 + 1) * 0.12 + Math.cos(time * 0.7) * 0.1;
            innerMaterial.size = 0.26 + Math.sin(time * 0.65) * 0.04;
            
            // 光晕闪烁
            halo1.material.opacity = 0.35 + Math.sin(time * 0.5) * 0.12 + Math.cos(time * 0.65) * 0.08;
            halo2.material.opacity = 0.22 + Math.cos(time * 0.55) * 0.1 + Math.sin(time * 0.7) * 0.07;
            halo3.material.opacity = 0.12 + Math.sin(time * 0.45) * 0.08 + Math.cos(time * 0.6) * 0.05;
            
            // 表面粒子大小微调
            surfaceMaterial.size = 0.33 + Math.sin(time * 0.5) * 0.04;
            
            renderer.render(scene, camera);
        }

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
