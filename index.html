<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>晚上星月争辉，美梦陪你入睡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ==========================================
        // 场景初始化
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 爱心形状 (使用心形参数方程生成3D形状)
        // ==========================================
        function createHeartShape() {
            const shape = new THREE.Shape();
            const points = 100;
            
            shape.moveTo(0, 0);
            for (let i = 0; i <= points; i++) {
                const t = (i / points) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                if (i === 0) {
                    shape.moveTo(x, y);
                } else {
                    shape.lineTo(x, y);
                }
            }
            return shape;
        }

        // ==========================================
        // 创建3D爱心主体（通过旋转成型获得立体感）
        // ==========================================
        function createHeartMesh() {
            const heartShape = createHeartShape();
            
            // 方法：使用 ExtrudeGeometry 拉伸出厚度
            const extrudeSettings = {
                depth: 1.5,
                bevelEnabled: true,
                bevelSegments: 4,
                bevelSize: 0.3,
                bevelThickness: 0.5
            };
            
            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            
            // 将几何体居中
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);
            
            return geometry;
        }

        // 爱心主体
        const heartGeometry = createHeartMesh();
        
        // 主体材质 - 带有发光效果
        const heartMaterial = new THREE.MeshPhongMaterial({
            color: 0xff1744,
            emissive: 0x330010,
            shininess: 80,
            specular: 0xff8888,
            flatShading: false
        });
        
        const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
        scene.add(heartMesh);

        // ==========================================
        // 粒子系统 - 包围爱心的闪烁星光
        // ==========================================
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const positions = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);
        const sizes = new Float32Array(particlesCount);

        for (let i = 0; i < particlesCount; i++) {
            // 在心形周围随机分布粒子
            const t = Math.random() * Math.PI * 2;
            const scale = 0.85 + Math.random() * 0.3;
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
            const z = (Math.random() - 0.5) * 4;
            
            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;
            
            // 红色系粒子颜色
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 0.05 + Math.random() * 0.3;
            colors[i * 3 + 2] = 0.1 + Math.random() * 0.3;
            
            sizes[i] = Math.random() * 0.15 + 0.05;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particlesGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 粒子材质
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // ==========================================
        // 外层光晕粒子
        // ==========================================
        const haloGeometry = new THREE.BufferGeometry();
        const haloCount = 2000;
        const haloPositions = new Float32Array(haloCount * 3);
        const haloColors = new Float32Array(haloCount * 3);

        for (let i = 0; i < haloCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const scale = 1.05 + Math.random() * 0.5;
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
            const z = (Math.random() - 0.5) * 6;
            
            haloPositions[i * 3] = x + (Math.random() - 0.5) * 3;
            haloPositions[i * 3 + 1] = y + (Math.random() - 0.5) * 3;
            haloPositions[i * 3 + 2] = z;
            
            haloColors[i * 3] = 1;
            haloColors[i * 3 + 1] = 0.1 + Math.random() * 0.2;
            haloColors[i * 3 + 2] = 0.15 + Math.random() * 0.25;
        }

        haloGeometry.setAttribute('position', new THREE.BufferAttribute(haloPositions, 3));
        haloGeometry.setAttribute('color', new THREE.BufferAttribute(haloColors, 3));

        const haloMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.5
        });

        const halo = new THREE.Points(haloGeometry, haloMaterial);
        scene.add(halo);

        // ==========================================
        // 灯光设置
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0x331111, 0.8);
        scene.add(ambientLight);
        
        const frontLight = new THREE.DirectionalLight(0xff8888, 1.5);
        frontLight.position.set(0, 0, 20);
        scene.add(frontLight);
        
        const backLight = new THREE.DirectionalLight(0xff4444, 0.8);
        backLight.position.set(0, 0, -10);
        scene.add(backLight);
        
        const topLight = new THREE.DirectionalLight(0xffcccc, 0.6);
        topLight.position.set(0, 15, 5);
        scene.add(topLight);

        // ==========================================
        // 动画循环
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // ----- 缓慢旋转 -----
            // Y轴旋转：非常缓慢的自转
            heartMesh.rotation.y = elapsedTime * 0.3;
            particles.rotation.y = elapsedTime * 0.3;
            halo.rotation.y = elapsedTime * 0.3;
            
            // 轻微的X轴和Z轴摆动，增加立体感
            heartMesh.rotation.x = Math.sin(elapsedTime * 0.4) * 0.15;
            heartMesh.rotation.z = Math.cos(elapsedTime * 0.35) * 0.1;
            particles.rotation.x = heartMesh.rotation.x;
            particles.rotation.z = heartMesh.rotation.z;
            halo.rotation.x = heartMesh.rotation.x;
            halo.rotation.z = heartMesh.rotation.z;
            
            // ----- 温柔呼吸效果 -----
            const breath = 1 + Math.sin(elapsedTime * 0.6) * 0.04;
            heartMesh.scale.setScalar(breath);
            particles.scale.setScalar(breath);
            halo.scale.setScalar(1 + Math.sin(elapsedTime * 0.6) * 0.06);
            
            // ----- 粒子闪烁 -----
            particlesMaterial.opacity = 0.6 + Math.sin(elapsedTime * 1.5) * 0.2 + Math.sin(elapsedTime * 2.3) * 0.15;
            haloMaterial.opacity = 0.3 + Math.sin(elapsedTime * 1.2) * 0.15 + Math.cos(elapsedTime * 1.8) * 0.1;
            
            // ----- 发光强度变化 -----
            heartMaterial.emissiveIntensity = 0.3 + Math.sin(elapsedTime * 0.8) * 0.15;
            
            renderer.render(scene, camera);
        }

        // ==========================================
        // 窗口大小调整
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动动画
        animate();
    </script>
</body>
</html>
